name: Camera Core Update GSC cohort QA
on:
  pull_request:
    paths:
      - "src/data/content/location-ae97a11505998e622d7a.json"
      - "src/data/content/location-46fd004eab5959adebbe.json"
      - "src/data/content/location-0112788194982c9ad3ae.json"
      - "src/data/content/location-77d7d0fe2919384f8289.json"
      - "scripts/qa-camera-core-update-4.mjs"
      - ".github/workflows/camera-core-update-cohort.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate content/metadata/route invariants
        run: node scripts/qa-camera-core-update-4.mjs
      - name: Build full camera site
        run: npm run build
      - name: Validate offline index/ownership/schema invariants
        run: npm run audit:c1-index-surface && npm run audit:c2-ownership && npm run audit:c3-template-schema
      - name: Validate exact redirects
        run: npm run qa:redirects
